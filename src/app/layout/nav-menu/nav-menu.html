<app-speed-menu
  [items]="slots"
  direction="up-right"
  label="Menu"
  [icon]="icon()"
  [expanded]="open()"
  [loading]="loading()"
  [ringContrast]="true"
  [ringInside]="true"
  (pressed)="menu.toggle($event)"
>
  <ng-template #item let-slot>
    @let action = actionOf(slot.name);
    @if (action) {
      @switch (slot.name) {
        @case ('back') {
          <app-back-action [action]="action" />
        }
      }
    }
  </ng-template>
</app-speed-menu>

<p-menu
  #menu
  appendTo="body"
  [model]="items"
  [popup]="true"
  (onShow)="open.set(true)"
  (onHide)="open.set(false)"
/>
