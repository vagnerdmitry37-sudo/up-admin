<button
  type="button"
  pButton
  class="trigger"
  aria-label="Menu"
  aria-haspopup="menu"
  [rounded]="true"
  [attr.aria-expanded]="open()"
  (click)="toggle(menu, $event)"
>
  <i class="pi pi-bars icon" aria-hidden="true" pButtonIcon [class.hidden]="open()"></i>
  <i class="pi pi-times icon close" aria-hidden="true" pButtonIcon [class.hidden]="!open()"></i>
</button>

<p-menu
  #menu
  appendTo="body"
  [model]="items"
  [popup]="true"
  (onShow)="open.set(true)"
  (onHide)="open.set(false)"
/>
