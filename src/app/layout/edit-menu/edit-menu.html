@if (hasActions()) {
  <p-speeddial
    [model]="items()"
    type="quarter-circle"
    direction="up-left"
    [radius]="80"
    [style]="{ position: 'absolute', right: 0, bottom: 0 }"
    [visible]="open()"
    [hideOnClickOutside]="false"
    ariaLabel="Edit actions"
    (onClick)="toggle()"
    (onHide)="keepOpen()"
  >
    <ng-template #item let-item>
      <button
        type="button"
        pButton
        pRipple
        class="p-speeddial-action"
        severity="secondary"
        [rounded]="true"
        size="small"
        [attr.aria-label]="item.label"
        [attr.tabindex]="open() ? 0 : null"
        appPress
        (press)="run(item.id, 'press')"
        (longPress)="run(item.id, 'longPress')"
      >
        <span pButtonIcon [class]="item.icon"></span>
      </button>
    </ng-template>
  </p-speeddial>
}
