@if (hasActions()) {
  <p-speeddial
    appMotion="scale"
    [model]="items()"
    type="quarter-circle"
    direction="up-left"
    [radius]="80"
    [style]="{ position: 'absolute', right: 0, bottom: 0 }"
    [visible]="open()"
    [hideOnClickOutside]="false"
    ariaLabel="Edit actions"
    (onClick)="toggle()"
    (onHide)="keepOpen()"
  >
    <ng-template #item let-item>
      <div class="action-menu-action">
        <button
          type="button"
          pButton
          pRipple
          class="p-speeddial-action"
          severity="secondary"
          [rounded]="true"
          size="small"
          [attr.aria-label]="labelOf(item)"
          [attr.aria-busy]="statusOf(item.id) === 'running'"
          [attr.tabindex]="open() ? 0 : null"
          [appActionTrigger]="triggerOf(item.id)"
          #trigger="actionTrigger"
          [icon]="iconOf(item)"
          (triggered)="runAction(item.id)"
        ></button>
        @if (trigger.holding()) {
          <app-progress-ring [value]="trigger.holdProgress()" />
        } @else if (statusOf(item.id) === 'running') {
          <p-progressspinner class="action-menu-spinner" strokeWidth="3" aria-hidden="true" />
        }
      </div>
    </ng-template>
  </p-speeddial>
}
