<app-speed-menu
  [items]="slots"
  direction="up-left"
  label="Edit actions"
  [icon]="actionsVisible() ? closeIcon : openIcon"
  [expanded]="actionsVisible()"
  [actionsVisible]="actionsVisible()"
  (pressed)="toggle()"
>
  <ng-template #item let-slot>
    @let action = actionOf(slot.name);
    @if (action) {
      @switch (slot.name) {
        @case ('create') {
          <app-create-action [action]="action" />
        }
        @case ('edit') {
          <app-edit-action [action]="action" />
        }
        @case ('delete') {
          <app-delete-action [action]="action" />
        }
        @case ('save') {
          <app-save-action [action]="action" />
        }
      }
    }
  </ng-template>
</app-speed-menu>
