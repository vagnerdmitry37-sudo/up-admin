<main class="content">
  <router-outlet />
</main>

<p-toast
  position="top-right"
  [life]="messageLife"
  [preventOpenDuplicates]="true"
  [breakpoints]="{ '640px': { width: 'calc(100vw - 2rem)' } }"
/>

<footer>
  <p-toolbar class="footer">
    <ng-template #start>
      <app-nav-menu />
      <app-page-heading />
    </ng-template>

    <ng-template #end>
      <app-action-menu-test />
    </ng-template>
  </p-toolbar>
</footer>
