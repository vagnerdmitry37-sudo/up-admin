<p-speeddial
  appMotion="scale"
  [model]="slots"
  type="quarter-circle"
  direction="up-left"
  [radius]="80"
  [style]="{ position: 'absolute', right: 0, bottom: 0 }"
  [visible]="true"
  [hideOnClickOutside]="false"
  ariaLabel="Edit actions"
>
  <ng-template #item let-slot>
    @let action = actionOf(slot.name);
    @if (action) {
      @switch (slot.name) {
        @case ('create') {
          <app-create-action [action]="action" />
        }
        @case ('edit') {
          <app-edit-action [action]="action" />
        }
        @case ('delete') {
          <app-delete-action [action]="action" />
        }
        @case ('save') {
          <app-save-action [action]="action" />
        }
      }
    }
  </ng-template>
</p-speeddial>
