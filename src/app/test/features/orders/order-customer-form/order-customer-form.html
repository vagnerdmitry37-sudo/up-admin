<app-entity-form [form]="form">
  <app-text-field
    label="Customer name"
    [control]="form.controls.customerName"
    [messages]="{ required: 'Enter a name.', maxlength: 'Use 200 characters or fewer.' }"
  />

  <app-text-field
    label="Email"
    [control]="form.controls.customerEmail"
    [messages]="{
      required: 'Enter an email.',
      email: 'Enter a valid email.',
      maxlength: 'Use 256 characters or fewer.',
    }"
  />

  <app-text-field
    label="Phone"
    [control]="form.controls.customerPhone"
    [messages]="{
      required: 'Enter a phone number.',
      maxlength: 'Use 50 characters or fewer.',
    }"
  />
</app-entity-form>
