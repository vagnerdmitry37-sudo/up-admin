@if (lazyRows.empty()) {
  <section class="empty-state">
    <h2 class="empty-heading">No {{ entityName() }}s yet</h2>
    <p class="empty-message">
      Use the Create action in the menu below to add your first {{ entityName() }}.
    </p>
  </section>
} @else if (lazyRows.rows(); as rows) {
  <app-entity-table
    [rows]="rows"
    [columns]="columns()"
    [lazy]="true"
    [entity]="entityName()"
    [deleteRows]="delete"
    (lazyLoad)="lazyRows.load($event)"
    (create)="open($event)"
    [(selection)]="selection"
    (edit)="open($event)"
  />
}
