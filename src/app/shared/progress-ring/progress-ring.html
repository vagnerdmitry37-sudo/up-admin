@if (shown()) {
  <svg class="progress-ring-layer progress-ring-meter" viewBox="25 25 50 50">
    <circle class="progress-ring-track" cx="50" cy="50" r="20" pathLength="100" />
    @if (value() !== undefined) {
      <circle
        class="progress-ring-fill"
        cx="50"
        cy="50"
        r="20"
        pathLength="100"
        [attr.stroke-dasharray]="(value() ?? 0) * 100 + ' 100'"
      />
    }
  </svg>
  @if (value() === undefined) {
    <p-progress-spinner
      class="progress-ring-layer"
      strokeWidth="3"
      [animationDuration]="turnDuration"
    />
  }
}
