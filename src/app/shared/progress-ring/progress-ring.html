@if (value() === undefined) {
  <p-progress-spinner strokeWidth="3" />
} @else {
  <svg class="progress-ring-meter" viewBox="25 25 50 50">
    <circle class="progress-ring-track" cx="50" cy="50" r="20" pathLength="100" />
    <circle
      class="progress-ring-fill"
      cx="50"
      cy="50"
      r="20"
      pathLength="100"
      [attr.stroke-dasharray]="(value() ?? 0) * 100 + ' 100'"
    />
  </svg>
}
