<p-table
  [value]="rows()"
  [loading]="loading()"
  [dataKey]="dataKey()"
  selectionMode="multiple"
  [selection]="selection()"
  (selectionChange)="selection.set($event)"
  [lazy]="lazy()"
  [scrollable]="lazy()"
  scrollHeight="flex"
  [virtualScroll]="lazy()"
  [virtualScrollItemSize]="rowHeight"
  [virtualScrollDelay]="0"
  [virtualScrollOptions]="{ showLoader: false }"
  (onLazyLoad)="loadRange($event)"
>
  <ng-template #header>
    <tr>
      @for (column of columns(); track column.header) {
        <th [class.end]="column.align === 'end'">{{ column.header }}</th>
      }
    </tr>
  </ng-template>
  <ng-template #body let-row>
    <tr [pSelectableRow]="row" [style.height.px]="rowHeight">
      @for (column of columns(); track column.header) {
        <td [class.end]="column.align === 'end'">{{ column.value(row) }}</td>
      }
    </tr>
  </ng-template>
  <ng-template #loadingbody>
    <tr [style.height.px]="rowHeight">
      @for (column of columns(); track column.header) {
        <td></td>
      }
    </tr>
  </ng-template>
</p-table>
