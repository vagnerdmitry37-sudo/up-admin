<app-field-frame>
  <p-autocomplete
    [inputId]="field.inputId"
    [formControl]="field.control()"
    [suggestions]="suggestions()"
    [optionLabel]="optionLabel()"
    (completeMethod)="complete($event)"
    [forceSelection]="true"
    [dropdown]="true"
    [showClear]="true"
    [showEmptyMessage]="true"
    emptyMessage="Nothing found"
    appendTo="body"
    fluid
    [invalid]="field.invalid()"
  />
</app-field-frame>
