<app-field-frame [labelFor]="false">
  <p-editor
    [formControl]="field.control()"
    [formats]="formats"
    [class.p-invalid]="field.invalid()"
    [class.source]="showSource()"
    (onInit)="labelContent($event)"
  >
    <ng-template #header>
      <span class="ql-formats format-tools" [inert]="showSource()">
        <select class="ql-header" aria-label="Text style">
          <option value="2">Heading 2</option>
          <option value="3">Heading 3</option>
          <option selected>Normal</option>
        </select>
      </span>
      <span class="ql-formats format-tools" [inert]="showSource()">
        <button type="button" class="ql-bold" aria-label="Bold"></button>
        <button type="button" class="ql-italic" aria-label="Italic"></button>
        <button type="button" class="ql-underline" aria-label="Underline"></button>
        <button type="button" class="ql-strike" aria-label="Strikethrough"></button>
      </span>
      <span class="ql-formats format-tools" [inert]="showSource()">
        <button type="button" class="ql-list" value="bullet" aria-label="Bulleted list"></button>
        <button type="button" class="ql-list" value="ordered" aria-label="Numbered list"></button>
        <button type="button" class="ql-blockquote" aria-label="Quote"></button>
        <button type="button" class="ql-link" aria-label="Link"></button>
      </span>
      <span class="ql-formats format-tools" [inert]="showSource()">
        <button type="button" class="ql-clean" aria-label="Clear formatting"></button>
      </span>
      <span class="ql-formats">
        <button
          type="button"
          class="source-toggle"
          aria-label="HTML source"
          [attr.aria-pressed]="showSource()"
          (click)="toggleSource()"
        >
          <i class="pi pi-code" aria-hidden="true"></i>
        </button>
      </span>
    </ng-template>
  </p-editor>
  @if (showSource()) {
    <textarea
      pTextarea
      class="source-text"
      [formControl]="field.control()"
      [invalid]="field.invalid()"
      [attr.aria-labelledby]="field.labelId"
      [attr.aria-describedby]="field.errorId"
      rows="10"
      autoResize
      fluid
    ></textarea>
  }
</app-field-frame>
