<app-field-frame [labelFor]="false">
  <p-select
    [inputId]="field.inputId"
    [ariaLabelledBy]="field.labelId"
    [formControl]="field.control()"
    [options]="options()"
    optionLabel="label"
    optionValue="value"
    appendTo="body"
    fluid
    [invalid]="field.invalid()"
  />
</app-field-frame>
