@if (entities().length === 1) {
  <ng-container
    [ngTemplateOutlet]="entityTemplate()"
    [ngTemplateOutletContext]="{ $implicit: entities()[0] }"
  />
} @else {
  <p-tabs [value]="shownId()" (valueChange)="show($event)" scrollable>
    <p-tablist>
      @for (entity of entities(); track entity.id) {
        <p-tab [value]="entity.id">{{ label()(entity) }}</p-tab>
      }
    </p-tablist>
    <p-tabpanels>
      @for (entity of entities(); track entity.id) {
        <p-tabpanel [value]="entity.id" lazy>
          <ng-template #content>
            <ng-container
              [ngTemplateOutlet]="entityTemplate()"
              [ngTemplateOutletContext]="{ $implicit: entity }"
            />
          </ng-template>
        </p-tabpanel>
      }
    </p-tabpanels>
  </p-tabs>
}
