@if (entities.hasValue()) {
  <app-entity-tabs [entities]="entities.value()" [label]="label()" [(active)]="activeId">
    <ng-template let-entity>
      <ng-container
        [ngTemplateOutlet]="entityTemplate()"
        [ngTemplateOutletContext]="{ $implicit: entity }"
      />
    </ng-template>
  </app-entity-tabs>
} @else if (!ids()) {
  <ng-container
    [ngTemplateOutlet]="entityTemplate()"
    [ngTemplateOutletContext]="{ $implicit: undefined }"
  />
}
