@if (openEntities(); as shownEntities) {
  <app-entity-tabs
    [entities]="shownEntities"
    [label]="label()"
    [closable]="!saving()"
    [(active)]="activeId"
    (closeTab)="close($event)"
  >
    <ng-template let-entity>
      <ng-container
        [ngTemplateOutlet]="entityTemplate()"
        [ngTemplateOutletContext]="{ $implicit: entity }"
      />
    </ng-template>
  </app-entity-tabs>
} @else if (!ids()) {
  <ng-container
    [ngTemplateOutlet]="entityTemplate()"
    [ngTemplateOutletContext]="{ $implicit: undefined }"
  />
}
