@if (tabs(); as shownTabs) {
  <app-entity-tabs
    [entities]="shownTabs"
    [label]="tabLabel()"
    [closable]="!actionRunning()"
    [(active)]="activeId"
    (closeTab)="close($event)"
  >
    <ng-template let-tab>
      <ng-container
        [ngTemplateOutlet]="entityTemplate()"
        [ngTemplateOutletContext]="{ $implicit: tab.entity }"
        [ngTemplateOutletInjector]="tabInjector(tab.id)"
      />
    </ng-template>
  </app-entity-tabs>
}
