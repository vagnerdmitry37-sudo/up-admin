<p-tabs [value]="activeTap()" scrollable>
  <p-tablist>
    @for (entity of entities(); track entity.id) {
      <p-tab class="tab" [value]="entity.id">
        <span class="tab-label" [title]="label()(entity)">{{ label()(entity) }}</span>
      </p-tab>
    }
  </p-tablist>
  <p-tabpanels>
    @for (entity of entities(); track entity.id) {
      <p-tabpanel [value]="entity.id" lazy>
        <ng-template #content>
          <ng-container
            [ngTemplateOutlet]="template()"
            [ngTemplateOutletContext]="{ $implicit: entity }"
          />
        </ng-template>
      </p-tabpanel>
    }
  </p-tabpanels>
</p-tabs>
