<app-entity-tabs [entities]="products()" [label]="productName" [(active)]="active">
  <ng-template let-product>
    <app-product-form
      [heading]="heading()"
      [product]="product"
      [productTypes]="productTypes()"
      [images]="imagesByProduct().get(product.id) ?? []"
      [formStatus]="productFormStatuses()[product.id] ?? 'idle'"
      [imagesStatus]="productImageStatuses()[product.id] ?? 'idle'"
    />
  </ng-template>
</app-entity-tabs>
