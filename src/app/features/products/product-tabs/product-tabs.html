@if (inTabs()) {
  <p-tabs [(value)]="active" scrollable lazy>
    <p-tablist>
      @for (product of openProducts(); track product.id) {
        <p-tab [value]="product.id">{{ product.name }}</p-tab>
      }
    </p-tablist>
    <p-tabpanels>
      @for (product of openProducts(); track product.id) {
        <p-tabpanel [value]="product.id">
          <ng-template #content>
            <app-product-form [heading]="heading()" [product]="product" />
          </ng-template>
        </p-tabpanel>
      }
    </p-tabpanels>
  </p-tabs>
} @else {
  @for (product of openProducts(); track product.id) {
    <app-product-form [heading]="heading()" [product]="product" />
  }
}
