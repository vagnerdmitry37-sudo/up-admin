<h1 class="title">Products</h1>

@let loaded = rows();
@if (!loaded || loaded.length > 0) {
  <app-data-table
    [rows]="loaded ?? []"
    [columns]="columns"
    [loading]="loading()"
    [lazy]="true"
    (lazyLoad)="load($event)"
    [(selection)]="selected"
  />
} @else {
  <section class="empty">
    <p class="empty-title">No products yet</p>
    <p>Tap + to add your first product.</p>
  </section>
}
