<h1 class="title">Products</h1>

@if (products.hasValue()) {
  @if (products.value().length === 0) {
    <section class="empty">
      <p class="empty-title">No products yet</p>
      <p>Tap + to add your first product.</p>
    </section>
  } @else {
    <p-table
      [value]="products.value()"
      dataKey="id"
      selectionMode="single"
      [(selection)]="selected"
    >
      <ng-template #header>
        <tr>
          <th>Name</th>
          <th>Type</th>
          <th class="price">Price</th>
        </tr>
      </ng-template>
      <ng-template #body let-product>
        <tr [pSelectableRow]="product">
          <td>{{ product.name }}</td>
          <td>{{ product.type }}</td>
          <td class="price">{{ product.price | number: '1.2-2' }}</td>
        </tr>
      </ng-template>
    </p-table>
  }
}
