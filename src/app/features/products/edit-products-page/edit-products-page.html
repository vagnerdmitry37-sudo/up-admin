<app-entity-edit-page
  [ids]="ids()"
  [load]="loadProducts"
  [label]="productName"
  [create]="createProduct"
>
  <ng-template let-product>
    <app-product-form [product]="product" [productTypes]="productTypes()" />
    <app-image-upload [images]="product?.images ?? []" />
  </ng-template>
</app-entity-edit-page>
