@for (field of fields(); track field.definition.key) {
  @if (field.definition.kind === 'WholeNumber') {
    <app-number-field
      [label]="field.definition.label"
      [control]="field.control"
      [min]="field.definition.min ?? undefined"
      [messages]="field.messages"
    />
  } @else {
    <app-text-field
      [label]="field.definition.label"
      [control]="field.control"
      [messages]="field.messages"
    />
  }
}
