@if (!from()) {
  <app-product-form
    [formStatus]="productFormStatuses()[newProductKey] ?? 'idle'"
    [imagesStatus]="productImageStatuses()[newProductKey] ?? 'idle'"
    (submitted)="create($event)"
  />
} @else if (copies(); as copies) {
  <app-product-tabs
    heading="Duplicate product"
    [products]="copies"
    [productFormStatuses]="productFormStatuses()"
    [productImageStatuses]="productImageStatuses()"
  />
}
