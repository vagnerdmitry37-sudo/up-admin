<app-page-title [heading]="heading()" />

<section class="section">
  <h2 class="section-title">Customer</h2>
  <app-order-customer-form
    [customer]="order()"
    [formStatus]="formStatuses()[customerKey()] ?? 'idle'"
    (submitted)="submitted.emit()"
  />
</section>

<section class="section">
  <h2 class="section-title">Items</h2>
  @if (items().length) {
    <app-data-table [rows]="items()" [columns]="columns" />
  } @else {
    <app-empty-state
      heading="No items yet"
      message="Fill in the customer and item forms and tap Save to create the order."
    />
  }
</section>

@for (formId of itemFormIds(); track formId) {
  <section class="section">
    <h2 class="section-title">New item</h2>
    <app-order-item-form
      [formId]="formId"
      [products]="products()"
      [formStatus]="formStatuses()[itemKey(formId)] ?? 'idle'"
      (submitted)="submitted.emit()"
    />
  </section>
}
