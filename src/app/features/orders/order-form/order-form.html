<app-page-title [heading]="heading()" />

<section class="section">
  <h2 class="section-title">Items</h2>
  @if (items().length) {
    <app-data-table
      [rows]="items()"
      [columns]="columns"
      [loading]="itemsLoading()"
      [(selection)]="selectedItems"
    >
      <ng-template #footer>
        <tr class="total-row">
          <td [attr.colspan]="columns.length - 1">Total</td>
          <td class="price">{{ totalPrice() }}</td>
        </tr>
      </ng-template>
    </app-data-table>
  } @else {
    <app-empty-state
      heading="No items yet"
      message="Fill in the item form and tap Add, then tap Save to create the order."
    />
  }
</section>

@if (itemFormEntries().length) {
  <section class="section">
    @if (itemFormEntries().length === 1) {
      <h2 class="section-title">{{ singleItemFormHeading() }}</h2>
    }
    <app-entity-tabs
      [entities]="itemFormEntries()"
      [label]="itemTabLabel"
      [lazy]="false"
      [(active)]="activeItemTab"
    >
      <ng-template let-entry>
        <app-order-item-form
          [formId]="entry.formId"
          [item]="entry.seed"
          [seedIsUnsavedChange]="!entry.itemId"
          [products]="products()"
          [formStatus]="formStatuses()[itemKey(entry.formId)] ?? 'idle'"
          (submitted)="submitted.emit()"
        />
      </ng-template>
    </app-entity-tabs>
  </section>
}
