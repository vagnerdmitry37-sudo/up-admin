<app-page-title [heading]="heading()" />

<section class="section">
  <h2 class="section-title">Customer</h2>
  <app-order-customer-form
    [customer]="order() ?? source()"
    [formStatus]="formStatuses()[customerKey()] ?? 'idle'"
    (submitted)="submitted.emit()"
  />
</section>

<section class="section">
  <h2 class="section-title">Items</h2>
  @if (items().length) {
    <app-data-table
      [rows]="items()"
      [columns]="columns"
      [loading]="itemsLoading()"
      [(selection)]="selectedItems"
    >
      <ng-template #footer>
        <tr class="total-row">
          <td [attr.colspan]="columns.length - 1">Total</td>
          <td class="price">{{ totalPrice() }}</td>
        </tr>
      </ng-template>
    </app-data-table>
  } @else {
    <app-empty-state
      heading="No items yet"
      message="Fill in the customer and item forms and tap Add, then tap Save to create the order."
    />
  }
</section>

@for (entry of itemFormEntries(); track entry.formId) {
  <section class="section">
    <h2 class="section-title">New item</h2>
    <app-order-item-form
      [formId]="entry.formId"
      [item]="entry.seed"
      [products]="products()"
      [formStatus]="formStatuses()[itemKey(entry.formId)] ?? 'idle'"
      (submitted)="submitted.emit()"
    />
  </section>
}
