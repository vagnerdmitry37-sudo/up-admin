<app-entity-form [form]="form" [value]="formValue()">
  <app-search-field
    label="Product"
    [control]="form.controls.product"
    [search]="searchProducts"
    [optionLabel]="productLabel"
    [messages]="{ required: 'Select a product.' }"
  />

  <app-date-time-field
    label="Starts"
    [control]="form.controls.startsAt"
    [messages]="{ required: 'Select a date and time.' }"
  />

  <app-number-field
    label="Passengers"
    [control]="form.controls.passengers"
    [min]="1"
    [messages]="{ required: 'Enter 1 to 100.', min: 'Enter 1 to 100.', max: 'Enter 1 to 100.' }"
  />

  <app-text-field
    label="Pickup address"
    [control]="form.controls.pickupAddress"
    [messages]="{ required: 'Enter a pickup address.', maxlength: 'Use 300 characters or fewer.' }"
  />

  <app-textarea-field
    label="Notes"
    [control]="form.controls.notes"
    [messages]="{ maxlength: 'Use 1000 characters or fewer.' }"
  />
</app-entity-form>
