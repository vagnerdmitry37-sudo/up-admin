<app-entity-form [form]="form" [value]="customer()">
  <app-text-field
    label="Name"
    [control]="form.controls.name"
    [messages]="{ required: 'Enter a name.', maxlength: 'Use 200 characters or fewer.' }"
  />

  <app-text-field
    label="Email"
    [control]="form.controls.email"
    [messages]="{
      required: 'Enter an email.',
      email: 'Enter a valid email.',
      maxlength: 'Use 256 characters or fewer.',
    }"
  />

  <app-text-field
    label="Phone"
    [control]="form.controls.phone"
    [messages]="{
      required: 'Enter a phone number.',
      maxlength: 'Use 50 characters or fewer.',
    }"
  />
</app-entity-form>
